<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioGestion — Utilisateurs</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1>BiblioGestion</h1>
            <p>Bibliothèque de quartier</p>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">Tableau de bord</a>
            <a href="livres.html">Livres</a>
            <a href="adherents.html">Adhérents</a>
            <a href="emprunts.html">Emprunts</a>
            <a href="users.html" class="active">Utilisateurs</a>
            <a href="profile.html">Mon profil</a>
        </nav>
        <div class="sidebar-footer">
            <div>
                <div class="user-name">…</div>
                <div class="user-role">…</div>
            </div>
            <a href="login.html" id="logout-link" class="logout-link">Déconnexion</a>
        </div>
    </aside>

    <div class="app-content">
        <main class="main">
            <div class="page-header">
                <div>
                    <h2>Utilisateurs</h2>
                    <p>Comptes du personnel ayant accès à l'application.</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" type="button"
                        onclick="document.getElementById('modal-new-user').classList.remove('hidden')">
                        + Ajouter un utilisateur
                    </button>
                </div>
            </div>

            <div id="users-error" class="alert alert-error hidden"></div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Rôle</th>
                            <th class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr class="empty-row">
                            <td colspan="4">Chargement...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="modal-overlay hidden" id="modal-new-user">
        <div class="modal">
            <div class="modal-header">
                <h3>Ajouter un utilisateur</h3>
                <button class="modal-close" type="button"
                    onclick="document.getElementById('modal-new-user').classList.add('hidden')">✕</button>
            </div>
            <form id="form-new-user">
                <div class="modal-body">
                    <div id="user-modal-error" class="alert alert-error hidden"></div>
                    <div class="form-group">
                        <label for="user-nom">Nom <span class="required">*</span></label>
                        <input type="text" id="user-nom" required minlength="2">
                    </div>
                    <div class="form-group">
                        <label for="user-email">Email <span class="required">*</span></label>
                        <input type="email" id="user-email" required>
                    </div>
                    <div class="form-group">
                        <label for="user-password">Mot de passe <span class="required">*</span></label>
                        <input type="password" id="user-password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="user-role">Rôle <span class="required">*</span></label>
                        <select id="user-role" required>
                            <option value="bibliothecaire">Bibliothécaire</option>
                            <option value="admin">Administrateur</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                        onclick="document.getElementById('modal-new-user').classList.add('hidden')">Annuler</button>
                    <button type="submit" class="btn btn-primary">Créer</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay hidden" id="modal-edit-user">
        <div class="modal">
            <div class="modal-header">
                <h3>Modifier l'utilisateur</h3>
                <button class="modal-close" type="button"
                    onclick="document.getElementById('modal-edit-user').classList.add('hidden')">✕</button>
            </div>
            <form id="form-edit-user">
                <div class="modal-body">
                    <div id="user-edit-error" class="alert alert-error hidden"></div>
                    <input type="hidden" id="edit-user-id">
                    <div class="form-group">
                        <label for="edit-user-nom">Nom <span class="required">*</span></label>
                        <input type="text" id="edit-user-nom" required minlength="2">
                    </div>
                    <div class="form-group">
                        <label for="edit-user-email">Email <span class="required">*</span></label>
                        <input type="email" id="edit-user-email" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-user-role">Rôle <span class="required">*</span></label>
                        <select id="edit-user-role" required>
                            <option value="bibliothecaire">Bibliothécaire</option>
                            <option value="admin">Administrateur</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                        onclick="document.getElementById('modal-edit-user').classList.add('hidden')">Annuler</button>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('logout-link').addEventListener('click', function(e) {
            e.preventDefault();
            logout();
        });
    </script>
    <script src="js/users.js"></script>
</body>

</html>
