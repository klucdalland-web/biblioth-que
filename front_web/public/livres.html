<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioGestion — Livres</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1>BiblioGestion</h1>
            <p>Bibliothèque de quartier</p>
        </div>
                <nav class="sidebar-nav">
            <a href="dashboard.html">Tableau de bord</a>
            <a href="livres.html" class="active">Livres</a>
            <a href="adherents.html">Adhérents</a>
            <a href="emprunts.html">Emprunts</a>
            <a href="users.html">Utilisateurs</a>
            <a href="profile.html">Mon profil</a>
        </nav>
        <div class="sidebar-footer">
            <div>
                <div class="user-name">…</div>
                <div class="user-role">…</div>
            </div>
            <a href="login.html" id="logout-link" class="logout-link">Déconnexion</a>
        </div>
    </aside>

    <div class="app-content">
        <main class="main">
            <div class="page-header">
                <div>
                    <h2>Gestion des livres</h2>
                    <p>Catalogue des ouvrages, disponibilité et recherche.</p>
                </div>
                <div class="header-actions">
                    <div class="search-bar">
                        <span class="icon">🔍</span>
                        <input type="search" id="livres-search" placeholder="Titre ou auteur...">
                    </div>
                    <button class="btn btn-primary" onclick="document.getElementById('modal-new-livre').classList.remove('hidden')" type="button">
            + Ajouter un livre
          </button>
                </div>
            </div>

            <div id="livres-error" class="alert alert-error hidden"></div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Titre</th>
                            <th>Auteur</th>
                            <th>Année</th>
                            <th>Statut</th>
                            <th class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="livres-table-body">
                        <tr class="empty-row">
                            <td colspan="5">Chargement...</td>
                        </tr>
                    </tbody>
                </table>
                <div class="pagination">
                    <button id="livres-prev" type="button">← Précédent</button>
                    <span class="page-info" id="livres-page-info">Page 1</span>
                    <button id="livres-next" type="button">Suivant →</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal : Ajouter un livre -->
    <div class="modal-overlay hidden" id="modal-new-livre">
        <div class="modal">
            <div class="modal-header">
                <h3>Ajouter un livre</h3>
                <button class="modal-close" onclick="document.getElementById('modal-new-livre').classList.add('hidden')" type="button">✕</button>
            </div>
            <form id="form-new-livre">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="livre-titre">Titre <span class="required">*</span></label>
                        <input type="text" id="livre-titre" placeholder="Ex. Les Misérables" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="livre-auteur">Auteur <span class="required">*</span></label>
                            <select id="livre-auteur" required>
                <option value="">Chargement...</option>
              </select>
                        </div>
                        <div class="form-group">
                            <label for="livre-annee">Année de publication</label>
                            <input type="text" id="livre-annee" placeholder="Ex. 1862">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('modal-new-livre').classList.add('hidden')">Annuler</button>
                    <button type="submit" class="btn btn-primary">Ajouter le livre</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        const logoutLink = document.getElementById("logout-link");
        if (logoutLink) {
            logoutLink.addEventListener("click", function(e) {
                e.preventDefault();
                logout();
            });
        }
    </script>
    <script src="js/livres.js"></script>
</body>

</html>
