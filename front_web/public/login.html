<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioGestion — Connexion</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="brand">
                <h1>BiblioGestion</h1>
                <p>Espace personnel — Bibliothèque de quartier</p>
            </div>

            <div id="login-error" class="alert alert-error hidden"></div>

            <form method="POST">
                <div class="form-group">
                    <label for="agent_id">Adresse email</label>
                    <input type="email" id="agent_id" name="agent_id" placeholder="votre.email@bibliotheque.fr" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
                </div>
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
